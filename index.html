<!DOCTYPE html>
<html>

<head>
    <title>Advanced Math Quiz Game</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            text-align: center;
            margin-top: 50px;
        }

        .game-box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px gray;
        }

        h1 {
            color: #333;
        }

        input {
            padding: 10px;
            width: 120px;
            font-size: 18px;
            margin-top: 10px;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background: #4facfe;
            color: white;
        }

        button:hover {
            background: #2196f3;
        }

        #result {
            font-size: 22px;
            margin-top: 15px;
            font-weight: bold;
        }

        .info {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="game-box">

        <h1>🎮 Advanced Math Quiz</h1>

        <h2 id="question">Question</h2>

        <input type="number" id="answer" placeholder="Answer">

        <br>

        <button onclick="checkAnswer()">Submit</button>

        <div id="result"></div>

        <div class="info">
            ❤️ Lives: <span id="lives">3</span>
        </div>

        <div class="info">
            ⭐ Score: <span id="score">0</span>
        </div>

        <div class="info">
            🎚️ Level: <span id="level">1</span>
        </div>

        <div class="info">
            ⏱️ Time Left: <span id="timer">10</span>
        </div>

    </div>

    <script>

        let num1;
        let num2;
        let correctAnswer;

        let score = 0;
        let lives = 3;
        let level = 1;

        let timeLeft = 10;
        let timer;

        function startTimer() {

            clearInterval(timer);

            timeLeft = 10;

            document.getElementById("timer").innerText = timeLeft;

            timer = setInterval(function () {

                timeLeft--;

                document.getElementById("timer").innerText = timeLeft;

                if (timeLeft <= 0) {

                    clearInterval(timer);

                    wrongAnswer("⏰ Time Up!");
                }

            }, 1000);
        }

        function newQuestion() {

            num1 = Math.floor(Math.random() * (level * 10)) + 1;
            num2 = Math.floor(Math.random() * (level * 10)) + 1;

            correctAnswer = num1 + num2;

            document.getElementById("question").innerText =
                `${num1} + ${num2} = ?`;

            startTimer();
        }

        function playCorrectSound() {

            let sound = new Audio("https://www.soundjay.com/buttons/sounds/button-3.mp3");
            sound.play();
        }

        function playWrongSound() {

            let sound = new Audio("https://www.soundjay.com/buttons/sounds/button-10.mp3");
            sound.play();
        }

        function checkAnswer() {

            let userAnswer =
                Number(document.getElementById("answer").value);

            if (userAnswer === correctAnswer) {

                playCorrectSound();

                document.getElementById("result").innerHTML =
                    "✅ Correct Answer!";

                score++;

                if (score % 5 === 0) {

                    level++;
                }

            } else {

                wrongAnswer("❌ Wrong Answer! Correct Answer Was: " + correctAnswer);
            }

            updateGame();

            document.getElementById("answer").value = "";

            newQuestion();
        }

        function wrongAnswer(message) {

            playWrongSound();

            document.getElementById("result").innerHTML = message;

            lives--;

            updateGame();

            if (lives <= 0) {

                clearInterval(timer);

                alert("💀 Game Over!\nFinal Score: " + score);

                location.reload();
            }
        }

        function updateGame() {

            document.getElementById("score").innerText = score;

            document.getElementById("lives").innerText = lives;

            document.getElementById("level").innerText = level;
        }

        newQuestion();

    </script>

</body>

</html>
