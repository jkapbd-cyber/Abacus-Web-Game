<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Advanced Math Quiz</title>

<style>

body{

    font-family: Arial;
    text-align: center;
    background: linear-gradient(to right, #4facfe, #00f2fe);
    margin: 0;
    padding: 0;
}

.game-box{

    width: 400px;
    background: white;
    margin: 50px auto;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 20px gray;
}

h1{

    color: #222;
}

input{

    padding: 10px;
    width: 150px;
    font-size: 20px;
    margin-top: 10px;
}

button{

    padding: 10px 20px;
    margin-top: 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: #4da3ff;
    color: white;
    cursor: pointer;
}

button:hover{

    background: #0077ff;
}

.info{

    margin-top: 20px;
    font-size: 20px;
}

#result{

    margin-top: 20px;
    font-size: 28px;
    font-weight: bold;
}

</style>

</head>

<body>

<div class="game-box">

<h1>🎮 Advanced Math Quiz</h1>

<h2 id="question">Question</h2>

<input type="number" id="answer" placeholder="Answer">

<br>

<button onclick="checkAnswer()">Submit</button>

<div id="result"></div>

<div class="info">
❤️ Lives: <span id="lives">3</span>
</div>

<div class="info">
⭐ Score: <span id="score">0</span>
</div>

<div class="info">
🎚️ Level: <span id="level">1</span>
</div>

<div class="info">
⏱️ Time Left: <span id="timer">10</span>
</div>

<div class="info">
🏆 High Score: <span id="highScore">0</span>
</div>

</div>

<script>

let num1;
let num2;
let correctAnswer;

let score = 0;
let level = 1;
let lives = 3;

let timeLeft = 10;
let timer;

let highScore = localStorage.getItem("highScore") || 0;

document.getElementById("highScore").innerText = highScore;

function startTimer(){

    clearInterval(timer);

    timeLeft = 10;

    document.getElementById("timer").innerText = timeLeft;

    timer = setInterval(function(){

        timeLeft--;

        document.getElementById("timer").innerText = timeLeft;

        if(timeLeft <= 0){

            clearInterval(timer);

            wrongAnswer("⏰ Time Up! Correct Answer Was: " + correctAnswer);
        }

    },1000);
}

function newQuestion(){

    num1 = Math.floor(Math.random() * (level * 10)) + 1;

    num2 = Math.floor(Math.random() * (level * 10)) + 1;

    let operations = ["+", "-", "*"];

    let operation =
        operations[Math.floor(Math.random() * operations.length)];

    if(operation == "+"){

        correctAnswer = num1 + num2;
    }

    else if(operation == "-"){

        correctAnswer = num1 - num2;
    }

    else{

        correctAnswer = num1 * num2;
    }

    document.getElementById("question").innerText =
        `${num1} ${operation} ${num2} = ?`;

    startTimer();
}

function playCorrectSound(){

    let sound =
        new Audio("https://www.soundjay.com/buttons/sounds/button-3.mp3");

    sound.play();
}

function playWrongSound(){

    let sound =
        new Audio("https://www.soundjay.com/buttons/sounds/button-10.mp3");

    sound.play();
}

function checkAnswer(){

    let userAnswer =
        Number(document.getElementById("answer").value);

    if(userAnswer === correctAnswer){

        playCorrectSound();

        document.getElementById("result").innerHTML =
            "✅ Correct!";

        score++;

        if(score % 5 === 0){

            level++;
        }
    }

    else{

        wrongAnswer("❌ Wrong! Correct Answer Was: " + correctAnswer);
    }

    updateGame();

    document.getElementById("answer").value = "";

    newQuestion();
}

function wrongAnswer(message){

    playWrongSound();

    document.getElementById("result").innerHTML = message;

    lives--;

    updateGame();

    if(lives <= 0){

        clearInterval(timer);

        alert("💀 Game Over!\nFinal Score: " + score);

        location.reload();
    }
}

function updateGame(){

    document.getElementById("score").innerText = score;

    document.getElementById("level").innerText = level;

    document.getElementById("lives").innerText = lives;

    if(score > highScore){

        highScore = score;

        localStorage.setItem("highScore", highScore);
    }

    document.getElementById("highScore").innerText = highScore;
}

newQuestion();

</script>

</body>

</html>
